<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Application</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.container{
    width:500px;
    max-width:90vw;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}
h1{
    text-align:center;
}
button{
    width:100%;
    padding:10px;
    margin:8px 0;
    font-size:18px;
    cursor:pointer;
}
#nextBtn{
    background:green;
    color:white;
    border:none;
}
#result{
    text-align:center;
    font-size:22px;
    color:green;
}
.confetti{
    position:fixed;
    top:-50px;
    font-size:28px;
    pointer-events:none;
    animation:fall linear forwards;
    z-index:999;
}
@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}
#review{
    text-align:left;
    margin-top:10px;
}
.review-item{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:10px;
    font-size:15px;
}
.review-item.correct{
    background:#eafaf0;
    border-color:#8fd9ab;
}
.review-item.wrong{
    background:#fdecea;
    border-color:#f3a6a0;
}
.review-question{
    font-weight:bold;
    margin-bottom:6px;
}
.review-line{
    margin:2px 0;
}
.tag-correct{
    color:#2e7d32;
    font-weight:bold;
}
.tag-wrong{
    color:#c62828;
    font-weight:bold;
}
.tag-unanswered{
    color:#888;
    font-style:italic;
}
</style>
</head>
<body>
<div class="container">
<h1>Quiz Application</h1>
<div id="quiz">
<h2 id="question"></h2>
<button onclick="checkAnswer(0)" id="opt0"></button>
<button onclick="checkAnswer(1)" id="opt1"></button>
<button onclick="checkAnswer(2)" id="opt2"></button>
<button onclick="checkAnswer(3)" id="opt3"></button>
<button id="nextBtn" onclick="nextQuestion()">Next</button>
</div>
<h2 id="result"></h2>
<div id="review"></div>
<button id="restartBtn" onclick="restartQuiz()" style="display:none;background:#2196F3;color:white;border:none;">Play Again</button>
</div>
<script>
const questionBank = [
{
question:"Which language is used for web development?",
options:["Java","Python","JavaScript","C"],
answer:2
},
{
question:"HTML stands for?",
options:[
"Hyper Text Markup Language",
"High Text Machine Language",
"Hyper Tool Multi Language",
"None"
],
answer:0
},
{
question:"CSS is used for?",
options:[
"Programming",
"Styling",
"Database",
"Networking"
],
answer:1
},
{
question:"Which keyword declares a variable in JavaScript?",
options:[
"int",
"var",
"float",
"double"
],
answer:1
},
{
question:"JavaScript runs inside?",
options:[
"Browser",
"Database",
"CPU",
"Compiler"
],
answer:0
},
{
question:"Which symbol is used for comments in JavaScript?",
options:["<!-- -->","//","**","##"],
answer:1
},
{
question:"Which tag is used to insert an image in HTML?",
options:["<image>","<img>","<src>","<pic>"],
answer:1
},
{
question:"Which property changes text color in CSS?",
options:["font-color","text-color","color","background-color"],
answer:2
},
{
question:"Which company developed JavaScript?",
options:["Microsoft","Netscape","Google","Apple"],
answer:1
},
{
question:"Which method converts a string to an integer in JavaScript?",
options:["parseInt()","toInt()","Integer()","Number.string()"],
answer:0
},
{
question:"Which HTML tag is used for the largest heading?",
options:["<h6>","<heading>","<h1>","<head>"],
answer:2
},
{
question:"Which CSS property controls the spacing between elements?",
options:["spacing","margin","gap-size","padding-outer"],
answer:1
},
{
question:"What does DOM stand for?",
options:[
"Document Object Model",
"Data Object Model",
"Document Order Model",
"Digital Ordinance Model"
],
answer:0
},
{
question:"Which operator is used for strict equality in JavaScript?",
options:["==","=","===","!="],
answer:2
},
{
question:"Which tag links an external CSS file to an HTML document?",
options:["<style>","<link>","<css>","<script>"],
answer:1
}
];
const TOTAL_QUESTIONS = 5;
let quiz = [];
let currentQuestion = 0;
let score = 0;
let userAnswers = [];
startQuiz();
function shuffleArray(arr){
const copy = arr.slice();
for(let i = copy.length - 1; i > 0; i--){
const j = Math.floor(Math.random() * (i + 1));
[copy[i], copy[j]] = [copy[j], copy[i]];
}
return copy;
}
function startQuiz(){
quiz = shuffleArray(questionBank).slice(0, TOTAL_QUESTIONS);
currentQuestion = 0;
score = 0;
userAnswers = new Array(quiz.length).fill(null);
document.getElementById("review").innerHTML = "";
loadQuestion();
}
function loadQuestion(){
document.getElementById("question").innerHTML =
quiz[currentQuestion].question;
document.getElementById("opt0").innerHTML =
quiz[currentQuestion].options[0];
document.getElementById("opt1").innerHTML =
quiz[currentQuestion].options[1];
document.getElementById("opt2").innerHTML =
quiz[currentQuestion].options[2];
document.getElementById("opt3").innerHTML =
quiz[currentQuestion].options[3];
for(let i=0;i<4;i++){
document.getElementById("opt"+i).style.background = "";
}
}
function checkAnswer(option){
userAnswers[currentQuestion] = option;
const correctIndex = quiz[currentQuestion].answer;

for(let i=0;i<4;i++){
const btn = document.getElementById("opt"+i);
btn.style.background = (i === option) ? "#cfe3ff" : "";
}
}
function nextQuestion(){
currentQuestion++;
if(currentQuestion < quiz.length){
for(let i=0;i<4;i++){
document.getElementById("opt"+i).style.background = "";
}
loadQuestion();
}
else{
document.getElementById("quiz").style.display = "none";
score = 0;
quiz.forEach((q, i) => {
if(userAnswers[i] === q.answer){
score++;
}
});
let message = "Quiz Finished!<br><br>Your Score : " + score + " / " + quiz.length;
if(score === quiz.length){
message += "<br><br>🎊🎉 Congratulations! 🎉🎊";
launchConfetti();
}
document.getElementById("result").innerHTML = message;
document.getElementById("review").innerHTML = buildReview();
document.getElementById("restartBtn").style.display = "block";
}
}

function buildReview(){
let html = "<h3 style='text-align:center;'>Answer Review</h3>";

quiz.forEach((q, i) => {
const userChoice = userAnswers[i];
const correctChoice = q.answer;
const wasAnswered = userChoice !== null;
const wasCorrect = wasAnswered && userChoice === correctChoice;

html += `<div class="review-item ${wasAnswered ? (wasCorrect ? "correct" : "wrong") : "wrong"}">`;
html += `<div class="review-question">${i+1}. ${q.question}</div>`;

if(wasAnswered){
html += `<div class="review-line">Your answer: ${q.options[userChoice]} `;
html += wasCorrect
? `<span class="tag-correct">✔ Correct</span>`
: `<span class="tag-wrong">✘ Wrong</span>`;
html += `</div>`;
if(!wasCorrect){
html += `<div class="review-line">Correct answer: <b>${q.options[correctChoice]}</b></div>`;
}
} else {
html += `<div class="review-line tag-unanswered">Not answered</div>`;
html += `<div class="review-line">Correct answer: <b>${q.options[correctChoice]}</b></div>`;
}

html += `</div>`;
});

return html;
}
function restartQuiz(){
document.getElementById("restartBtn").style.display = "none";
document.getElementById("result").innerHTML = "";
document.getElementById("review").innerHTML = "";
document.getElementById("quiz").style.display = "block";
startQuiz();
}
function launchConfetti(){
const emojis = ["🎉","🎊"];
const total = 40;
for(let i=0; i<total; i++){
const piece = document.createElement("div");
piece.className = "confetti";
piece.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
piece.style.left = Math.random()*100 + "vw";
piece.style.animationDuration = (2 + Math.random()*2) + "s";
piece.style.animationDelay = (Math.random()*1.5) + "s";
document.body.appendChild(piece);
setTimeout(() => piece.remove(), 5000);
}
}
</script>
</body>
</html>
