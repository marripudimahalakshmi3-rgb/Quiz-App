<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Application</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.container{
    width:500px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}
h1{
    text-align:center;
}
button{
    width:100%;
    padding:10px;
    margin:8px 0;
    font-size:18px;
    cursor:pointer;
}
#nextBtn{
    background:green;
    color:white;
    border:none;
}
#result{
    text-align:center;
    font-size:22px;
    color:green;
}
.confetti{
    position:fixed;
    top:-50px;
    font-size:28px;
    pointer-events:none;
    animation:fall linear forwards;
    z-index:999;
}
@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}
</style>
</head>
<body>
<div class="container">
<h1>Quiz Application</h1>
<div id="quiz">
<h2 id="question"></h2>
<button onclick="checkAnswer(0)" id="opt0"></button>
<button onclick="checkAnswer(1)" id="opt1"></button>
<button onclick="checkAnswer(2)" id="opt2"></button>
<button onclick="checkAnswer(3)" id="opt3"></button>
<button id="nextBtn" onclick="nextQuestion()">Next</button>
</div>
<h2 id="result"></h2>
<button id="restartBtn" onclick="restartQuiz()" style="display:none;background:#2196F3;color:white;border:none;">Play Again</button>
</div>
<script>
const questionBank = [
{
question:"Which language is used for web development?",
options:["Java","Python","JavaScript","C"],
answer:2
},
{
question:"HTML stands for?",
options:[
"Hyper Text Markup Language",
"High Text Machine Language",
"Hyper Tool Multi Language",
"None"
],
answer:0
},
{
question:"CSS is used for?",
options:[
"Programming",
"Styling",
"Database",
"Networking"
],
answer:1
},
{
question:"Which keyword declares a variable in JavaScript?",
options:[
"int",
"var",
"float",
"double"
],
answer:1
},
{
question:"JavaScript runs inside?",
options:[
"Browser",
"Database",
"CPU",
"Compiler"
],
answer:0
},
{
question:"Which symbol is used for comments in JavaScript?",
options:["<!-- -->","//","**","##"],
answer:1
},
{
question:"Which tag is used to insert an image in HTML?",
options:["<image>","<img>","<src>","<pic>"],
answer:1
},
{
question:"Which property changes text color in CSS?",
options:["font-color","text-color","color","background-color"],
answer:2
},
{
question:"Which company developed JavaScript?",
options:["Microsoft","Netscape","Google","Apple"],
answer:1
},
{
question:"Which method converts a string to an integer in JavaScript?",
options:["parseInt()","toInt()","Integer()","Number.string()"],
answer:0
},
{
question:"Which HTML tag is used for the largest heading?",
options:["<h6>","<heading>","<h1>","<head>"],
answer:2
},
{
question:"Which CSS property controls the spacing between elements?",
options:["spacing","margin","gap-size","padding-outer"],
answer:1
},
{
question:"What does DOM stand for?",
options:[
"Document Object Model",
"Data Object Model",
"Document Order Model",
"Digital Ordinance Model"
],
answer:0
},
{
question:"Which operator is used for strict equality in JavaScript?",
options:["==","=","===","!="],
answer:2
},
{
question:"Which tag links an external CSS file to an HTML document?",
options:["<style>","<link>","<css>","<script>"],
answer:1
}
];
const TOTAL_QUESTIONS = 5;
let quiz = [];
let currentQuestion = 0;
let score = 0;
startQuiz();
function shuffleArray(arr){
const copy = arr.slice();
for(let i = copy.length - 1; i > 0; i--){
const j = Math.floor(Math.random() * (i + 1));
[copy[i], copy[j]] = [copy[j], copy[i]];
}
return copy;
}
function startQuiz(){
quiz = shuffleArray(questionBank).slice(0, TOTAL_QUESTIONS);
currentQuestion = 0;
score = 0;
loadQuestion();
}
function loadQuestion(){
document.getElementById("question").innerHTML =
quiz[currentQuestion].question;
document.getElementById("opt0").innerHTML =
quiz[currentQuestion].options[0];
document.getElementById("opt1").innerHTML =
quiz[currentQuestion].options[1];
document.getElementById("opt2").innerHTML =
quiz[currentQuestion].options[2];
document.getElementById("opt3").innerHTML =
quiz[currentQuestion].options[3];
}
function checkAnswer(option){
if(option == quiz[currentQuestion].answer){
score++;
}
document.getElementById("opt0").disabled = true;
document.getElementById("opt1").disabled = true;
document.getElementById("opt2").disabled = true;
document.getElementById("opt3").disabled = true;
}
function nextQuestion(){
currentQuestion++;
if(currentQuestion < quiz.length){
document.getElementById("opt0").disabled = false;
document.getElementById("opt1").disabled = false;
document.getElementById("opt2").disabled = false;
document.getElementById("opt3").disabled = false;
loadQuestion();
}
else{
document.getElementById("quiz").style.display = "none";
let message = "Quiz Finished!<br><br>Your Score : " + score + " / " + quiz.length;
if(score === quiz.length){
message += "<br><br>🎊🎉 Congratulations! 🎉🎊";
launchConfetti();
}
document.getElementById("result").innerHTML = message;
document.getElementById("restartBtn").style.display = "block";
}
}
function restartQuiz(){
document.getElementById("restartBtn").style.display = "none";
document.getElementById("result").innerHTML = "";
document.getElementById("quiz").style.display = "block";
startQuiz();
}
function launchConfetti(){
const emojis = ["🎉","🎊"];
const total = 40;
for(let i=0; i<total; i++){
const piece = document.createElement("div");
piece.className = "confetti";
piece.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];
piece.style.left = Math.random()*100 + "vw";
piece.style.animationDuration = (2 + Math.random()*2) + "s";
piece.style.animationDelay = (Math.random()*1.5) + "s";
document.body.appendChild(piece);
setTimeout(() => piece.remove(), 5000);
}
}
</script>
</body>
</html>
